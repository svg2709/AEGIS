name: Build & Auto-Release AEGIS Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-web-and-proxy:
    name: Verify Web Preview & AI Proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build and lint server
        run: |
          npm run build
          npm run lint

  build-and-release-android:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history for changelogs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
          build-root-directory: android

      - name: Determine release version & tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG#v}"
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
            TAG="v${VERSION_NAME}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Decode optional release keystore
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "${KEYSTORE_B64}" ]]; then
            KEYSTORE_FILE="${RUNNER_TEMP}/aegis-release.jks"
            echo "${KEYSTORE_B64}" | base64 --decode > "${KEYSTORE_FILE}"
            echo "keystore_path=${KEYSTORE_FILE}" >> "${GITHUB_OUTPUT}"
            echo "mode=Signed Release Keystore" >> "${GITHUB_OUTPUT}"
          else
            echo "keystore_path=" >> "${GITHUB_OUTPUT}"
            echo "mode=Installable Debug-Signed Release (add ANDROID_KEYSTORE_BASE64 secret for custom signing)" >> "${GITHUB_OUTPUT}"
          fi

      - name: Compile Android APKs
        working-directory: android
        env:
          AEGIS_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          AEGIS_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Package APKs & SHA-256 checksums
        shell: bash
        env:
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "release-artifacts/aegis-android-${VERSION_NAME}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-artifacts/aegis-android-${VERSION_NAME}-debug.apk"
          (cd release-artifacts && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh release-artifacts

      - name: Generate release changelog
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)
          KB_STATS=$(node -e 'const kb=require("./android/app/src/main/assets/aegis_kb.json"); console.log(`${kb.domainCount} domains / ${kb.articleCount} offline protocols`);')

          {
            echo "## AEGIS Android ${TAG}"
            echo ""
            echo "- **Version**: \`${VERSION_NAME}\` (build \`${GITHUB_RUN_NUMBER}\`)"
            echo "- **Offline Knowledge Base**: ${KB_STATS}"
            echo "- **Display Theme**: True AMOLED \`#000000\` pitch-black default for OLED battery conservation"
            echo "- **Signing**: ${SIGNING_MODE}"
            echo ""
            echo "### Changelog"
            if [[ -n "${PREV_TAG}" ]]; then
              COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (\`%h\`) — %an" --no-merges)
            else
              COMMITS=$(git log -n 20 --pretty=format:"- %s (\`%h\`) — %an" --no-merges)
            fi
            if [[ -n "${COMMITS}" ]]; then
              echo "${COMMITS}"
            else
              echo "- Automated release build for commit \`${GITHUB_SHA::7}\`"
            fi
            echo ""
            if [[ -n "${PREV_TAG}" ]]; then
              echo "**Full Diff**: ${REPO_URL}/compare/${PREV_TAG}...${TAG}"
              echo ""
            fi
            echo "### SHA-256 Checksums"
            echo '```text'
            cat release-artifacts/SHA256SUMS.txt
            echo '```'
          } > release-notes.md

          cat release-notes.md

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aegis-android-${{ steps.meta.outputs.version_name }}
          path: |
            release-artifacts/*
            release-notes.md

      - name: Publish GitHub Release automatically
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: AEGIS Android ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          make_latest: true
          files: |
            release-artifacts/*.apk
            release-artifacts/SHA256SUMS.txt
